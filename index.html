<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id="agregarComida">
        
        <label>Nombre de la comida</label>
         <input type="text" name="nombre" placeholder="Nombre de la comida" required>
         
         <label>Categoria</label>
         <input type="text" name="categoria"placeholder="Categoria" required>

         <label>Provincia</label>
         <input type="text" name="provincia"placeholder="Pone tu provincia" required>

         <label>Ingredientes</label>
         <input type="text" name="ingredientes"placeholder="Pone tu ingredientes" required>

         

        <button id="enviarComida" type="submit">Agrega pa</button>  
      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
